package = "lunar-talk"
version = "0.1.0"
lua = ">=5.4"

[description]
summary = "Smalltalk system on Lua runtime"
maintainer = "Rob Sayers"
labels = [ "language" ]
license = "MIT"

[dependencies]
inspect = "3.1.3-0"
debugger = "scm-1"
luaunit = "3.4-1"
lpeg = "1.1.0-2"
argparse = "0.7.1-1"
pegasus = "1.0.9-0"
ezserv = "1.3-1"
quinku = "1.0-1"


[run]
args = [ "src/main.lua" ]

[source]
url = "https://lunartalk.st/releases/lunartalk-0.1.0.tar.gz"

[build]
type = "builtin"

[test]
type = "command"
script = "tests/tests.lua"
